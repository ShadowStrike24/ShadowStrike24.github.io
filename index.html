        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --window-bar-bg: #f1f5f9;
        }

        /* Dark Mode Renk Degiskenleri */
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --accent-bg: #1e293b;
            --window-bar-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Top Window Bar (3 Dots Style) */
        .window-bar {
            background: var(--window-bar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .window-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Dark Mode Switch Button */
        .theme-toggle-btn {
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .theme-toggle-btn:hover {
            border-color: var(--primary);
        }

        /* Navbar */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-badge {
            background: var(--accent-bg);
            color: var(--primary);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Hero */
        .hero {
            max-width: 900px;
            margin: 3.5rem auto 2.5rem auto;
            text-align: center;
            padding: 0 1.5rem;
        }
