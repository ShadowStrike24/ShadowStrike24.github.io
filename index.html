<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teslimat Aşkı · Sürüş</title>
<style>
:root{--card:#1f1a2b;--ink:#f6efe6;--mut:#a79bb8;--acc:#ff5d7a;--line:#3b3150}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0b14;color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
canvas#c{display:block;width:100%;height:100%}
.ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,7,16,.74);padding:16px;overflow:auto}
.ui.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px;max-width:580px;width:100%;box-shadow:0 24px 70px #000a}
h1{margin:0 0 6px;font:700 34px/1.1 Georgia,serif;color:var(--acc)}h2{margin:0 0 6px;font:700 20px Georgia,serif}
p{margin:8px 0}small,.hint{color:var(--mut)}.hint{font-size:13px}
.btn{display:block;width:100%;margin:9px 0 0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#2b2340;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.btn:hover{background:#3a2c52;border-color:var(--acc)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.sel{border-color:var(--acc)!important;background:#4a2a48!important}
.row{display:flex;gap:9px}.row .btn{text-align:center}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#140f1d;color:var(--ink);font:inherit;margin-top:4px}
.box{position:absolute;background:rgba(14,10,22,.8);border:1px solid var(--line);border-radius:14px;pointer-events:none}
#nav{top:10px;left:50%;transform:translateX(-50%);padding:8px 18px;text-align:center;min-width:250px;display:none}
#nav b{font-size:30px;margin-right:8px;vertical-align:middle}#nav .d{font-size:26px;font-weight:700}
#hud{top:10px;left:10px;padding:8px 12px;font-size:14px;display:none}
#mm{top:10px;right:10px;width:150px;height:150px;display:none}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nav" class="box"></div><div id="hud" class="box"></div><canvas id="mm" class="box" width="150" height="150"></canvas>
<div id="toast"></div>
<div id="ov" class="ui"><div class="card"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),mg=$('#mm').getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const SEG=200,RW=2000,DD=130,D=.84,CH=900,M=143,VMAX=8200,PZ=CH*D;
const PL=[{n:'DoorDash',c:'#ff3008',m:1},{n:'Uber Eats',c:'#06c167',m:1.2},{n:'Skip',c:'#ff8000',m:.9}];
const pal=(a,b,n,rain,sun,w,gr)=>({sk:[a,b],n,rain,sun,w,gr:gr||'#2c3b30',g2:'#324236',rd:'#3a3a45',r2:'#3e3e4a'});
const PAL=[pal('#3b3552','#8a7d9c',.25,1,0,'🌧️ Yağmurlu akşam'),pal('#3a2c6a','#ff9d5c',.1,0,1,'🌇 Gün batımı'),pal('#5fb0ff','#e6f3ff',0,0,1,'☀️ Güneşli sabah','#3d5a3a'),
 pal('#060820','#2b2d62',1,0,0,'🌙 Gece','#1b2420'),pal('#080b1c','#2b3350',1,1,0,'🌧️ Yağmurlu gece','#1b2420'),pal('#4aa3e8','#d4ecff',0,0,1,'🌤️ Öğleden sonra','#3d5a3a'),pal('#5b3a8c','#ffb36b',.15,0,1,'🌅 Altın saat')];
const STR=['Gül','Lale','Çınar','Menekşe','Papatya','Akasya','Defne','Kirazlı','Zambak','Erguvan'];
const HOME=['Gül Apt. D:4','Papatya Cd. 7'];
const MS=[
{pl:0,pal:0,r:['Kebapçı Mehmet','Lale Sk. 12'],msg:'Müşteri: "Yağmur başladı, çorba sıcak kalsın lütfen!"'},
{pl:1,pal:1,r:['Mavi Kafe','Çınar Sk. 3'],msg:'Müşteri: "Cheesecake için acele etme... ama bekliyorum :)"'},
{pl:2,pal:2,r:['Mavi Kafe','Çınar Sk. 3'],msg:'Müşteri: "Kahveyi kapıda bekliyorum."'},
{pl:0,pal:3,r:['Sushi Ada','Defne Cd. 21'],msg:'Müşteri: "Bu gece sahile gidiyoruz, değil mi?"'},
{pl:1,pal:4,r:['Wok Express','Akasya Sk. 8'],msg:'Müşteri: "Saat geç oldu, dikkatli sür lütfen."'},
{pl:2,pal:5,r:['Tatlı Köşe','Menekşe Sk. 5'],msg:'Müşteri: "Bugün sana bir sürprizim var..."'},
{pl:0,pal:6,r:['Pasta Atölyesi','Kirazlı Cd. 1'],msg:'Müşteri: "Düğün pastası hazır mı?"'}].map(m=>({...m,c:HOME}));
let W,H,dpr,S,P=PAL[1],mode='title',road=[],cars=[],R={turns:[],len:0,dest:['','']},keys={},st,toastT=0,hudT=0,mute=0,ac,EO,EG,last=0;

/* ===== Hikâye ===== */
const N=t=>['N',t],Pp=t=>['P',t],L=t=>['L',t];
const CH=[
{t:'Bölüm 1 · Kapıda',l:[N(`Yağmurlu akşam. Teslimat Gül Apartmanı'nın dördüncü katına. Asansör bozuk, çorba hâlâ sıcak.`),L(`(kapıyı aralar) Bu kadar hızlı geleceğini sanmıyordum. Sırılsıklam olmuşsun!`),Pp(`İyi akşamlar! Çorbanız. Dışarısı sel ama çorba kurtuldu.`),L(`Bir dakika, havlu getireyim. Kimse bana sipariş getirirken bu kadar gülümsememişti.`)],
 o:[[`"Havlu kalsın, ama bir bardak çaya hayır demem."`,2,[L(`Çay mı? Mutfakta demlik hep hazır. Bir dahaki sefere!`)]],[`"Teşekkürler, sıradaki siparişe yetişmeliyim."`,1,[L(`Tabii. Yine de al şu şemsiyeyi, geri getirirsin.`)]],[`"Uygulamadan beş yıldız vermeniz yeter."`,0,[L(`(gülümser) Beş yıldız. Belki altı.`)]]]},
{t:'Bölüm 2 · Küçük Not',l:[N(`Birkaç gün sonra aynı kapı. Sipariş Mavi Kafe'den: iki dilim cheesecake.`),L(`Bu sefer kapıda bekliyordum. Adını öğrenebilir miyim? Uygulamada sadece "Kurye 4417" yazıyor.`),Pp(`Adım {p}. Sizinki?`),L(`{n}. Bundan sonra sana {p} diyeceğim; "Kurye 4417" çok soğuk duruyor.`),N(`Poşetin içinde bir kâğıt: "Yağmur dinince çay borcun var."`)],
 o:[[`"Mesai bitince olur."`,2,[L(`Anlaştık! Demliği ocağa koyuyorum.`)]],[`"Bir dilim yeter, kalanı sende kalsın."`,1,[L(`Peki, diğer dilim senin adına saklanıyor.`)]],[`"Kural gereği bir şey alamam."`,0,[L(`Kurallara saygı duyuyorum... ama kapım açık.`)]]]},
{t:'Bölüm 3 · Kahve Kokusu',l:[N(`Siparişi verirken {n}'in kapıda, elinde kitapla seni beklediğini görüyorsun.`),L(`Şehir bizi hep aynı sokaklarda buluşturuyor. Tesadüf mü bu?`),Pp(`Kurye olmanın en güzel yanı şehrin sırlarını bilmek. Mesela en güzel kahve sabah dokuzda çıkar.`),L(`O halde yarın sabah dokuzda bir kahve borcun var. Bu sefer ben ısmarlıyorum.`)],
 o:[[`"Anlaştık. Motoru park ederim."`,2,[L(`Sabah dokuz, Mavi Kafe. Geç kalırsan yeni bir bahane uydururum.`)]],[`"Motorsuz yürümeyi unuttum, ama denerim."`,1,[L(`Yürürken konuşmak daha iyi, sakin sakin.`)]],[`"Sen sipariş vermeye devam et."`,0,[L(`(güler) Tamam, sipariş vermek de bir tür davettir.`)]]]},
{t:'Bölüm 4 · Sahil Yolu',l:[N(`Cumartesi gecesi. Teslimat çantası yok; iki kask var, biri {n} için.`),L(`Motora hiç binmedim. Biraz korkuyorum.`),Pp(`Sıkı tutun. Şehrin kenarında bir yer var, ışıklar denize yansıyor.`),N(`Sahil yolu. Rüzgâr, kahkahalar ve ilk kez teslimat saatine bakmayan bir {p}.`),L(`Binlerce paket taşıdın ama bu gece en değerli paket ben olmalıyım.`)],
 o:[[`"En özenli teslim edilen paket bu."`,2,[L(`O zaman imza yerine bir şey söyleyeceğim: iyi ki kapıyı açtım.`)]],[`"Sigortası bende, merak etme."`,1,[L(`Güvendeyim. Hem de ilk kez bu kadar mutluyum.`)]],[`"Bahşişi sonra konuşuruz."`,0,[L(`Bahşiş mi? Sana bir dünya borçluyum.`)]]]},
{t:'Bölüm 5 · Uzun Gece',l:[N(`Haftalardır gece yarısına kadar çalışıyorsun. Motor sesi rüyalarına bile giriyor.`),L(`Saat 01.30 oldu. Gözlerinin altı mor. Yoruldun {p}.`),Pp(`Biraz. Ama bu şehirde herkesin sıcak yemeği benim sayemde.`),L(`Peki senin sıcak kalan bir yerin var mı?`)],
 o:[[`"Seninle konuşmak yeterli. Yarın erken bitiririm."`,2,[L(`O zaman yarın akşam yemeği ben yapıyorum, sipariş yok!`)]],[`"Biraz dinleneceğim, söz."`,1,[L(`Söz vermeni bekleyeceğim, ben de hatırlatırım.`)]],[`"Çalışmak zorundayım, anlamazsın."`,0,[L(`(sessizce) Haklısın... ama anlamak istiyorum.`)]]]},
()=>({t:'Bölüm 6 · En Önemli Sipariş',l:[N(`Bir yıl dolmak üzere. Cebinde küçük bir kutu var; bu, hayatının en önemli teslimatı.`),Pp(`{n}, ilk teslimatımdaki çorba hâlâ aklımda.`),Pp(`Bunca paket taşıdım ama senin kapında durmak bana hep eve dönmek gibi geldi.`),Pp(`Evlenir misin benimle?`),
 ...(S.aff>=5?[L(`Evet... Evet! Binlerce kez evet!`),N(`Yüzük parmağa tam oturdu. Sokakta bir motor kornası çaldı; belki de şehir kutluyordu.`)]:[L(`Seni çok seviyorum {p}... ama biraz zamana ihtiyacım var. Yüzüğü sakla, birlikte biraz daha yol gidelim.`),N(`Bu bir "hayır" değil, bir "henüz". Birlikte biraz daha vakit geçirmek gerek.`)])]}),
{t:'Bölüm 7 · Düğün',l:[N(`Sahilde küçük bir düğün. Davetliler arasında kuryeler, restoran sahipleri, kafedeki garsonlar var.`),L(`Hepsi seni tanıyor {p}. Şehrin yarısı sana minnettar.`),Pp(`Ve bir kişi hayatımın geri kalanını kabul etti.`),N(`Evlilik bir paket değil; ikiniz de aynı yoldan eve dönüyorsunuz.`)],
 o:[[`"Sana hep sıcak getireceğim."`,2,[L(`Ben de hep kapıyı açacağım.`)]],[`"Gelen siparişe değil, yanındakine yetişeceğim."`,2,[L(`Bu şehirde duyduğum en güzel söz.`)]],[`"Yeter ki asansör bozulmasın."`,1,[L(`(güler) Bozulsun. Dördüncü kata çıkmanın tadı başka.`)]]]}];
const fmt=t=>t.replaceAll('{n}',S.lover).replaceAll('{p}',S.name),nm=w=>w=='L'?S.lover:w=='P'?S.name:'Anlatıcı';
function dlg(sc,cb){
  let i=0,ch=0;const Ls=[...sc.l];
  const show=()=>{
    if(i<Ls.length){const[w,t]=Ls[i];ov(`<small>${sc.t}</small><h2 style="color:${w=='L'?'#ff7a96':w=='P'?'#ffc65a':'#a79bb8'}">${nm(w)}</h2><p>${fmt(t)}</p><button class="btn" id="nx">Devam ▶ (Boşluk)</button>`);$('#nx').onclick=()=>{i++;show()}}
    else if(sc.o&&!ch){ov(`<small>${sc.t}</small><h2>Ne yaparsın?</h2>`+sc.o.map((o,n)=>`<button class="btn" data-n="${n}">${fmt(o[0])}</button>`).join(''));
      document.querySelectorAll('#ov [data-n]').forEach(b=>b.onclick=()=>{const o=sc.o[b.dataset.n];ch=1;S.aff+=o[1];Ls.push(...o[2]);show()})}
    else{ov();cb()}};
  show();
}

/* ===== Yol üretimi ===== */
const fresh=(name,lover)=>({name,lover,money:0,earn:0,del:0,m:0,aff:0,rat:4.8,up:{eng:0,grip:0},ring:0});
function newSt(){return{z:0,x:0,v:0,steer:0,roll:0,shake:0,cd:0,sky:0}}
function mkRoad(len,turns,dest){
  const n=Math.ceil(len/SEG)+220;road=[];let y=0,cu=0,hl=0,tc=0,th=0,left=0;
  for(let i=0;i<n;i++){
    if(left--<=0){left=rnd(30,90)|0;tc=Math.random()<.4?0:rnd(-2.2,2.2);th=rnd(-12,12)-y*.004}
    cu=lerp(cu,tc,.05);hl=lerp(hl,th,.04);road.push({i,z:i*SEG,y,cu,sp:[]});y+=hl;
  }
  road.forEach(s=>{
    if(s.i%5==0)[-1,1].forEach(d=>Math.random()<.7&&s.sp.push({t:'b',x:d*rnd(1.8,2.8),w:rnd(700,1500),h:rnd(1200,4200),hu:rnd(200,310)|0,l:rnd(.7,1.3)}));
    if(s.i%12==0)[-1,1].forEach(d=>s.sp.push({t:'l',x:d*1.18}));
    if(s.i%7==3)[-1,1].forEach(d=>Math.random()<.5&&s.sp.push({t:'t',x:d*rnd(1.3,1.5)}));
  });
  turns.forEach(t=>{
    const j=Math.floor(t.at/SEG);
    for(let k=j;k<j+15;k++){const s=road[k];s.j=t.dir;s.sp=s.sp.filter(p=>p.x*t.dir<0)}
    road[j-30].sp.push({t:'a',x:0,txt:(t.dir<0?'↰ Sola dön · ':'↱ Sağa dön · ')+t.st,col:'#14527a'});
  });
  road[Math.floor(len/SEG)].sp.push({t:'a',x:0,txt:'📍 '+dest[0]+' · '+dest[1],col:'#b3175a'});
}
function respawn(c){c.z=st.z+rnd(2500,DD*SEG-500);c.x=pick([-.67,0,.67]);c.v=rnd(2200,5000);c.col=`hsl(${rnd(0,360)|0},55%,${rnd(35,55)|0}%)`;return c}
function leg(k){
  const m=MS[S.m],len=(900+S.m*140+k*100)*M,nt=2+(Math.random()<.5?1:0),turns=[];
  for(let i=0;i<nt;i++)turns.push({at:len*(i+1)/(nt+1)+rnd(-.05,.05)*len,dir:Math.random()<.5?-1:1,st:pick(STR)+pick([' Sk.',' Cd.']),done:0});
  R={k,len,end:len,turns,t:Math.round(len/M/20+25),dest:k?m.c:m.r};
  let x=0,y=0,a=-Math.PI/2,pv=0;const Pt=[{x,y,d:0}];
  [...turns.map(t=>[t.at,t.dir]),[len,0]].forEach(([at,dir])=>{const l=(at-pv)/M;x+=Math.cos(a)*l;y+=Math.sin(a)*l;Pt.push({x,y,d:at});a+=dir*Math.PI/2;pv=at});R.P=Pt;
  st=newSt();mkRoad(len,turns,R.dest);cars=Array.from({length:14},()=>respawn({}));
}

/* ===== Oyun akışı ===== */
function begin(){ov();S.m=0;brief()}
function brief(){
  mode='brief';const m=MS[S.m],pl=PL[m.pl];P=PAL[m.pal];hideHud();
  ov(`<small>📱 Yeni sipariş · ${S.m+1}/7</small><h2 style="color:${pl.c}">${pl.n}</h2>
  <p>🍴 <b>1) Paketi al:</b> ${m.r[0]}<br><small>${m.r[1]}</small></p><p>🏠 <b>2) Teslim et:</b> ${m.c[0]}<br><small>${m.c[1]}</small></p>
  <p class="hint">${P.w} · tahmini kazanç $${Math.round((55+S.m*8)*pl.m)}+bahşiş</p><button class="btn" id="go">🧭 Navigasyonu başlat</button>`);
  $('#go').onclick=()=>{ov();leg(0);mode='ride';startEngine();toast('Navigasyon açık. Gaz: W / ↑');say(`Navigasyon başlatıldı. ${m.r[0]} adresine gidiyorsunuz.`)};
}
function arrive(){
  mode='scene';st.v=0;beep(880,.2);const m=MS[S.m],pl=PL[m.pl];hideHud();
  if(R.k==0){
    ov(`<h2>📦 Paket alındı</h2><p>${m.r[0]} siparişi hazırladı. Paket çantada.</p><p>Sıradaki adres: <b>${m.c[0]}</b><br><small>${m.c[1]}</small></p><button class="btn" id="go">🧭 Müşteriye git</button>`);
    $('#go').onclick=()=>{ov();leg(1);mode='ride';toast(m.msg);say(`Paket alındı. ${m.c[0]} adresine gidiyorsunuz.`)};
  }else{
    const late=R.t<0,pay=+((55+S.m*8)*pl.m*(late?.75:1)).toFixed(0),tip=late?0:Math.round(rnd(8,30));
    S.money+=pay+tip;S.earn+=pay+tip;S.del++;S.rat=+(S.rat*.85+(late?2.8:5)*.15).toFixed(3);
    const n=S.m,sc=typeof CH[n]=='function'?CH[n]():CH[n];
    ov(`<h2>✅ Teslim edildi</h2><p>+$${pay}${tip?` · bahşiş $${tip}`:''}${late?' · geç kaldın':''}</p><button class="btn" id="go">Kapıyı çal ▶</button>`);
    $('#go').onclick=()=>dlg(sc,()=>{if(n==5&&S.aff<5)S.aff+=3;else S.m++;save();S.m>=7?ending():garage()});
  }
}
const UP=[['eng','🏍️ Motor','daha hızlı ve çevik'],['grip','🛞 Lastik & fren','daha iyi tutuş']],UC=[40,90,150];
function garage(){
  mode='garage';
  let h=`<h2>🛠️ Garaj</h2><p>Bakiye <b>$${S.money}</b> · Puan ⭐${S.rat.toFixed(2)} · ❤️ ${S.m}/7</p>`;
  UP.forEach(([k,n,d])=>{const lv=S.up[k];h+=lv>=3?`<button class="btn" disabled>${n} · MAKS</button>`:`<button class="btn" data-k="${k}" ${S.money<UC[lv]?'disabled':''}>${n} Sv.${lv}→${lv+1} · ${d} · $${UC[lv]}</button>`});
  if(S.m==5&&!S.ring){const c=Math.min(120,S.money);h+=`<button class="btn" data-k="ring">💍 Yüzük · ${c?'$'+c:'arkadaşların hediyesi'}</button>`}
  h+=`<button class="btn" id="go" ${S.m==5&&!S.ring?'disabled':''}>Sıradaki sipariş ▶</button>`;
  ov(h);
  document.querySelectorAll('#ov [data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='ring'){S.money-=Math.min(120,S.money);S.ring=1}else{S.money-=UC[S.up[k]];S.up[k]++}beep(700,.1);garage()});
  $('#go').onclick=brief;
}
function ending(){
  mode='end';hideHud();
  ov(`<h1>💒 Mutlu Son</h1><p>${S.name} ve ${S.lover} evlendi. ${S.aff>=10?'Hikâyeniz şehirde dilden dile dolaşıyor.':'Hikâyeniz bir teslimat gibi: zamanında, sıcak ve özenle.'}</p>
  <p class="hint">${S.del} teslimat · toplam kazanç $${S.earn} · puan ⭐${S.rat.toFixed(2)}</p><p>Artık motorun çantasında hep iki çay bardağı var.</p><button class="btn" id="nw">Yeni oyun</button>`);
  $('#nw').onclick=()=>{try{localStorage.removeItem('teslimat3')}catch(e){}title()};
}
function save(){try{localStorage.setItem('teslimat3',JSON.stringify(S))}catch(e){}}
function title(){
  mode='title';S=fresh('Kurye','Elif');P=PAL[1];R={turns:[],len:0,dest:['','']};st=newSt();mkRoad(150000,[],['','']);cars=Array.from({length:14},()=>respawn({}));hideHud();
  let sv=null;try{sv=JSON.parse(localStorage.getItem('teslimat3'))}catch(e){}
  ov(`<h1>🛵 Teslimat Aşkı</h1><p>DoorDash, Uber Eats ve Skip siparişlerini motorla taşı. Adresi al, navigasyonu izle, doğru sokağa dön. Bir kapının ardında hayatının aşkı olabilir.</p>
  <label>Adın<input id="nm" value="Kurye" maxlength="14"></label><p style="margin-bottom:0">Kalbini çalan kişi</p>
  <div class="row"><button class="btn sel" data-l="Elif">Elif</button><button class="btn" data-l="Can">Can</button></div>
  <button class="btn" id="go" style="text-align:center;background:#ff5d7a;color:#1b0f17;font-weight:700">Vardiyayı başlat</button>
  ${sv?`<button class="btn" id="ct" style="text-align:center">Devam et (${sv.name} · sipariş ${sv.m+1}/7)</button>`:''}
  <p class="hint">W/↑ gaz · S/↓ fren · A D / ←→ yönlendir · Boşluk el freni · M sesli yönlendirme aç/kapa<br>Kavşakta dönüş yönündeki şeride geç. Hedefte yavaşla ve dur.</p>`);
  let lv='Elif';
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=b.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('sel',x==b))});
  $('#go').onclick=()=>{S=fresh($('#nm').value.trim()||'Kurye',lv);begin()};
  if(sv)$('#ct').onclick=()=>{S={...fresh(sv.name,sv.lover),...sv};ov();brief()};
}

/* ===== Güncelleme ===== */
function moveCars(dt){for(const c of cars){c.z+=c.v*dt;if(c.z<st.z-1500||c.z>st.z+DD*SEG)respawn(c)}}
function update(dt){
  const k=keys,up=k.w||k.arrowup,dn=k.s||k.arrowdown,lf=k.a||k.arrowleft,rt=k.d||k.arrowright,u=S.up,vm=VMAX+u.eng*500,bs=road[Math.floor(st.z/SEG)]||road[0];
  if(up)st.v+=(2900+u.eng*300)*dt;else st.v-=700*dt;
  if(dn)st.v-=(6500+u.grip*600)*dt;if(k[' '])st.v-=9000*dt;
  if(Math.abs(st.x)>1.08&&st.v>2200)st.v-=5000*dt;
  st.v=cl(st.v,0,vm);const pc=st.v/vm;
  st.steer=lerp(st.steer,(rt?1:0)-(lf?1:0),Math.min(1,dt*8));
  const dx=dt*2*pc;st.x+=dx*st.steer*(1+u.grip*.12)*1.1;st.x-=dx*pc*bs.cu*.22;st.x=cl(st.x,-2,2);
  st.z+=st.v*dt;st.cd-=dt;st.shake*=1-4*dt;R.t-=dt;moveCars(dt);
  for(const c of cars){const d=c.z-(st.z+PZ);if(st.cd<=0&&d>-140&&d<140&&Math.abs(c.x-st.x)<.3){st.cd=1.2;st.v*=.35;st.shake=24;S.money=Math.max(0,S.money-10);toast('💥 Çarptın! -$10');beep(90,.25);c.z+=700}}
  const t=R.turns.find(t=>!t.done),p=st.z+PZ;
  if(t){
    const d=(t.at-p)/M,w=t.dir<0?'sola':'sağa';
    if(d<300&&!t.v1){t.v1=1;say(`300 metre sonra ${w} dönün`)}
    if(d<80&&!t.v2){t.v2=1;say(`Şimdi ${w} dönün`)}
    if(p>t.at+9*SEG){t.done=1;if(t.dir*st.x>.4)toast(`✓ ${t.st} üzerindesin`);else{toast('↺ Yanlış yol! Yeniden hesaplanıyor (-6 sn)');R.t-=6;say('Yeniden hesaplanıyor')}}
  }else if((R.end-p)/M<200&&!R.v1){R.v1=1;say('Hedefe 200 metre. Yavaşlayın.')}
  if(p>=R.end){if(st.v<2600)arrive();else{toast('📍 Adresi geçtin! Geri alındın: yavaşla ve dur.');st.z=R.end-PZ-60*M;st.v=0;R.t-=5}}
  if(EO&&!mute){EO.frequency.value=40+pc*150;EG.gain.value=.02+(up?.02:0)}else if(EG)EG.gain.value=0;
}

/* ===== Çizim ===== */
function proj(p,cx,cy,cz){const x=p.x-cx,y=p.y-cy,z=p.z-cz,sc=D/Math.max(z,1);p.sc=sc;p.cz=z;p.sx=W/2+sc*x*W/2;p.sy=H/2-sc*y*H/2;p.sw=sc*RW*W/2}
const quad=(x1,y1,w1,x2,y2,w2,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(x1-w1,y1);g.lineTo(x2-w2,y2);g.lineTo(x2+w2,y2);g.lineTo(x1+w1,y1);g.fill()};
function drawSeg(s){
  const a=s.p1,b=s.p2,alt=(s.i>>1)&1;
  g.fillStyle=alt?P.gr:P.g2;g.fillRect(-W,b.sy,W*3,a.sy-b.sy+1);
  quad(a.sx,a.sy,a.sw*1.5,b.sx,b.sy,b.sw*1.5,'#55515f');
  quad(a.sx,a.sy,a.sw*1.1,b.sx,b.sy,b.sw*1.1,alt?'#d33':'#eee');
  quad(a.sx,a.sy,a.sw,b.sx,b.sy,b.sw,alt?P.rd:P.r2);
  if(s.j){const o=s.j*2.4;quad(a.sx+o*a.sw,a.sy,a.sw*1.45,b.sx+o*b.sw,b.sy,b.sw*1.45,P.rd)}
  if(s.i%8<4)[-1,1].forEach(d=>quad(a.sx+d*a.sw/3,a.sy,a.sw*.02,b.sx+d*b.sw/3,b.sy,b.sw*.02,'#e8e8e8'));
}
const clipped=(s,sy,f)=>{if(sy>s.cl){g.save();g.beginPath();g.rect(-W,-H,W*3,s.cl+H);g.clip();f();g.restore()}else f()};
function spr(s,p){
  const a=s.p1,u=a.sc*W/2,sx=a.sx+p.x*RW*u,sy=a.sy;if(u*1000<4)return;
  clipped(s,sy,()=>{
    if(p.t=='b'){
      const w=p.w*u,h=p.h*u;g.fillStyle=`hsl(${p.hu},16%,${P.n>.5?11:26*p.l}%)`;g.fillRect(sx-w/2,sy-h,w,h);
      if(w>10){g.fillStyle=P.n>.3?'#ffd97aaa':'#ffffff22';for(let i=0;i<4;i++)for(let j=0;j<8;j++)if((i*5+j*3+p.hu)%3)g.fillRect(sx-w/2+w*(.12+i*.22),sy-h+h*(.06+j*.115),w*.12,h*.06)}
    }else if(p.t=='t'){
      g.fillStyle='#33261b';g.fillRect(sx-60*u,sy-700*u,120*u,700*u);g.fillStyle=P.n>.5?'#16382a':'#2c6b43';g.beginPath();g.arc(sx,sy-1100*u,520*u,0,7);g.fill();
    }else if(p.t=='l'){
      g.fillStyle='#2a2a33';g.fillRect(sx-25*u,sy-1900*u,50*u,1900*u);g.fillRect(sx-(p.x<0?-1:1)*0-25*u,sy-1900*u,(p.x<0?400:-400)*u,50*u);
      if(P.n>.3){g.fillStyle='#ffe9a8';g.beginPath();g.arc(sx+(p.x<0?400:-400)*u,sy-1860*u,90*u,0,7);g.fill()}
    }else{
      const sw=a.sw*1.2,h=2600*u;g.fillStyle='#222';g.fillRect(sx-sw-30*u,sy-h,60*u,h);g.fillRect(sx+sw-30*u,sy-h,60*u,h);
      g.fillStyle=p.col;g.fillRect(sx-sw,sy-h,sw*2,640*u);g.strokeStyle='#fff';g.lineWidth=Math.max(1,8*u);g.strokeRect(sx-sw,sy-h,sw*2,640*u);
      const fs=Math.min(340*u,sw*2/(p.txt.length*.6));if(fs>6){g.fillStyle='#fff';g.font=`bold ${fs}px "Trebuchet MS"`;g.textAlign='center';g.fillText(p.txt,sx,sy-h+440*u)}
    }
  });
}
function car(s,c){
  const pct=(c.z%SEG)/SEG,a=s.p1,b=s.p2,sc=lerp(a.sc,b.sc,pct),u=sc*W/2,sx=lerp(a.sx,b.sx,pct)+c.x*RW*u,sy=lerp(a.sy,b.sy,pct);
  clipped(s,sy,()=>{
    const w=900*u,h=560*u;g.fillStyle='#0007';g.fillRect(sx-w*.55,sy-h*.08,w*1.1,h*.16);
    g.fillStyle=c.col;g.fillRect(sx-w/2,sy-h*.7,w,h*.62);g.fillStyle='#10131c';g.fillRect(sx-w*.38,sy-h,w*.76,h*.34);g.fillStyle=c.col;g.fillRect(sx-w*.42,sy-h*1.02,w*.84,h*.06);
    g.fillStyle='#ff2a2a';g.fillRect(sx-w*.47,sy-h*.55,w*.2,h*.12);g.fillRect(sx+w*.27,sy-h*.55,w*.2,h*.12);
  });
}
function render(){
  const bs=road[Math.floor(st.z/SEG)]||road[0],bp=(st.z%SEG)/SEG,py=lerp(bs.y,(road[bs.i+1]||bs).y,bp),camY=py+CH,pc=st.v/(VMAX+S.up.eng*500);
  st.roll=lerp(st.roll,st.steer*.035-bs.cu*pc*.012,.1);st.sky-=bs.cu*pc*3;
  g.setTransform(dpr,0,0,dpr,0,0);g.save();
  g.translate(W/2+(Math.random()-.5)*st.shake,H/2+(Math.random()-.5)*st.shake);g.rotate(st.roll);g.scale(1.1,1.1);g.translate(-W/2,-H/2);
  const gr=g.createLinearGradient(0,0,0,H/2);gr.addColorStop(0,P.sk[0]);gr.addColorStop(1,P.sk[1]);g.fillStyle=gr;g.fillRect(-W,-H,W*3,H*1.5);
  g.fillStyle=P.gr;g.fillRect(-W,H/2,W*3,H);
  if(P.sun){g.fillStyle='#fff0c455';g.beginPath();g.arc(W*.7+st.sky*.2,H*.36,H*.13,0,7);g.fill();g.fillStyle='#fff6d8';g.beginPath();g.arc(W*.7+st.sky*.2,H*.36,H*.07,0,7);g.fill()}
  g.fillStyle=P.n>.5?'#0a0c1c':`hsl(250,18%,${P.sun?34:24}%)`;
  for(let i=-1;i<W/60+3;i++){const id=i-Math.floor(st.sky/60),h=24+(((id*7919)%13)+13)%13*9;g.fillRect(i*60+(st.sky%60)-W*.1,H/2-h,58,h+2)}
  let dx=-(bs.cu*bp),x=0,maxy=H;const vis=[];
  for(let n=0;n<DD;n++){
    const s=road[bs.i+n];if(!s)break;const s2=road[bs.i+n+1]||s,cx=st.x*RW-x;
    s.p1={x:0,y:s.y,z:s.z};s.p2={x:0,y:s2.y,z:s.z+SEG};proj(s.p1,cx,camY,st.z);proj(s.p2,cx-dx,camY,st.z);
    x+=dx;dx+=s.cu;s.cl=maxy;
    if(s.p1.cz<=D||s.p2.sy>=s.p1.sy||s.p2.sy>=maxy)continue;
    drawSeg(s);maxy=s.p2.sy;vis.push(s);
  }
  const bk={};cars.forEach(c=>{const i=Math.floor(c.z/SEG);(bk[i]=bk[i]||[]).push(c)});
  for(let n=vis.length-1;n>=0;n--){const s=vis[n];s.sp.forEach(p=>spr(s,p));(bk[s.i]||[]).forEach(c=>car(s,c))}
  g.restore();
  if(P.rain){g.strokeStyle='#cfe3ff55';g.lineWidth=1.3;g.beginPath();const t=performance.now()/1000;for(let i=0;i<110;i++){const rx=((i*83.7)%1000)/1000*W-t*60,ry=(((i*0.618)+t*1.7)%1)*H;g.moveTo((rx%W+W)%W,ry);g.lineTo((rx%W+W)%W-5,ry+24)}g.stroke()}
  if(pc>.6){g.strokeStyle=`rgba(255,255,255,${(pc-.6)*.35})`;g.lineWidth=2;g.beginPath();const t=performance.now();for(let i=0;i<16;i++){const a=i*.39+(t/90%1)*.1,r1=Math.min(W,H)*(.45+((i*37)%10)/40);g.moveTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1);g.lineTo(W/2+Math.cos(a)*r1*1.5,H/2+Math.sin(a)*r1*1.5)}g.stroke()}
  if(P.n>0){g.fillStyle=`rgba(4,6,30,${P.n*.42})`;g.fillRect(0,0,W,H)}
  if(P.n>.3){const hl=g.createRadialGradient(W/2,H*.78,10,W/2,H*.78,H*.5);hl.addColorStop(0,'rgba(255,235,170,.28)');hl.addColorStop(1,'rgba(255,235,170,0)');g.fillStyle=hl;g.fillRect(0,0,W,H)}
  const vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=vg;g.fillRect(0,0,W,H);
  bikeView(pc);
}
function bikeView(pc){
  const k=Math.min(W,H*1.7)/1000,sx=st.steer;
  g.save();g.translate(W/2+sx*26*k,H+8*k);g.rotate(sx*.06);
  const Ln=(x1,y1,x2,y2,w,c)=>{g.strokeStyle=c;g.lineWidth=w*k;g.lineCap='round';g.beginPath();g.moveTo(x1*k,y1*k);g.lineTo(x2*k,y2*k);g.stroke()};
  [-1,1].forEach(d=>{
    Ln(d*340,-130,d*385,-300,10,'#1b1b22');
    g.fillStyle='#161d2b';g.beginPath();g.ellipse(d*398*k,-345*k,80*k,52*k,-d*.25,0,7);g.fill();
    g.fillStyle=P.sk[1];g.globalAlpha=.55;g.beginPath();g.ellipse(d*398*k,-345*k,68*k,41*k,-d*.25,0,7);g.fill();g.globalAlpha=1;
    g.strokeStyle='#08080c';g.lineWidth=8*k;g.beginPath();g.ellipse(d*398*k,-345*k,80*k,52*k,-d*.25,0,7);g.stroke();
    Ln(d*90,-70,d*420,-125,30,'#15151b');Ln(d*410,-150,d*300,-172,8,'#8a8a95');
    g.fillStyle='#2748b8';g.beginPath();g.ellipse(d*440*k,-118*k,70*k,44*k,d*.2,0,7);g.fill();g.fillStyle='#4f78e8';g.beginPath();g.ellipse(d*440*k,-134*k,48*k,16*k,d*.2,0,7);g.fill();
  });
  g.fillStyle='#f2c200';g.beginPath();g.moveTo(-190*k,0);g.lineTo(-120*k,-125*k);g.lineTo(120*k,-125*k);g.lineTo(190*k,0);g.fill();
  g.fillStyle='#b58f00';g.beginPath();g.moveTo(-190*k,0);g.lineTo(-170*k,0);g.lineTo(-105*k,-125*k);g.lineTo(-120*k,-125*k);g.fill();
  g.fillStyle='#0d1119';g.beginPath();g.roundRect(-150*k,-262*k,300*k,150*k,28*k);g.fill();g.strokeStyle='#2c3a58';g.lineWidth=5*k;g.stroke();
  g.strokeStyle=pc>.85?'#ff4d4d':'#4de1ff';g.lineWidth=9*k;g.beginPath();g.arc(0,-165*k,98*k,Math.PI*.8,Math.PI*.8+pc*Math.PI*1.4);g.stroke();
  g.fillStyle='#8be9ff';g.textAlign='center';g.font=`bold ${60*k}px monospace`;g.fillText(Math.round(st.v/VMAX*190),0,-165*k);
  g.fillStyle='#7d8aa8';g.font=`${22*k}px sans-serif`;g.fillText('km/h',0,-135*k);
  g.restore();
}
function hideHud(){['#nav','#hud','#mm'].forEach(s=>$(s).style.display='none')}
function hud(){
  ['#nav','#hud','#mm'].forEach(s=>$(s).style.display='block');
  const t=R.turns.find(t=>!t.done),p=st.z+PZ;let ar,txt,d;
  if(t){d=(t.at-p)/M;ar=t.dir<0?'↰':'↱';txt=(t.dir<0?'Sola dön · ':'Sağa dön · ')+t.st}else{d=(R.end-p)/M;ar='📍';txt=R.dest[0]+' · '+R.dest[1]}
  const rem=Math.max(0,(R.end-p)/M);
  $('#nav').innerHTML=`<b>${ar}</b><span class="d">${d>=1000?(d/1000).toFixed(1)+' km':Math.max(0,Math.round(d/10)*10)+' m'}</span><br>${txt}<br><small>Kalan ${(rem/1000).toFixed(2)} km · <span style="color:${R.t<10?'#ff6b6b':'inherit'}">⏱ ${Math.max(0,R.t|0)} sn</span></small>`;
  $('#hud').innerHTML=`💰 $${S.money}<br>⭐ ${S.rat.toFixed(2)}<br><span style="color:${PL[MS[S.m].pl].c}">${PL[MS[S.m].pl].n}</span>`;
  const P2=R.P;let a=1e9,b=1e9,c2=-1e9,d2=-1e9;P2.forEach(q=>{a=Math.min(a,q.x);b=Math.min(b,q.y);c2=Math.max(c2,q.x);d2=Math.max(d2,q.y)});
  const s=Math.min(110/((c2-a)||1),110/((d2-b)||1)),T=q=>[20+(q.x-a)*s+(110-(c2-a)*s)/2,20+(q.y-b)*s+(110-(d2-b)*s)/2];
  mg.clearRect(0,0,150,150);mg.lineWidth=5;mg.lineJoin='round';mg.strokeStyle='#5a5470';mg.beginPath();P2.forEach((q,i)=>{const[x,y]=T(q);i?mg.lineTo(x,y):mg.moveTo(x,y)});mg.stroke();
  let i=0;while(i<P2.length-2&&p>P2[i+1].d)i++;const f=cl((p-P2[i].d)/((P2[i+1].d-P2[i].d)||1),0,1),pp={x:lerp(P2[i].x,P2[i+1].x,f),y:lerp(P2[i].y,P2[i+1].y,f)};
  mg.strokeStyle='#ffc65a';mg.beginPath();P2.slice(0,i+1).forEach((q,j)=>{const[x,y]=T(q);j?mg.lineTo(x,y):mg.moveTo(x,y)});mg.lineTo(...T(pp));mg.stroke();
  let e=T(P2[P2.length-1]);mg.fillStyle='#ff4f86';mg.beginPath();mg.arc(e[0],e[1],6,0,7);mg.fill();e=T(pp);mg.fillStyle='#fff';mg.beginPath();mg.arc(e[0],e[1],5,0,7);mg.fill();
}

/* ===== Yardımcılar ===== */
function ov(h){const o=$('#ov');if(h){o.firstElementChild.innerHTML=h;o.classList.add('on')}else o.classList.remove('on')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');toastT=3.5}
function say(t){if(mute)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}
function beep(f,d){try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type='triangle';o.frequency.value=f;v.gain.value=.06;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function startEngine(){try{ac=ac||new AudioContext();if(!EO){EO=ac.createOscillator();EG=ac.createGain();EO.type='sawtooth';EG.gain.value=0;EO.connect(EG);EG.connect(ac.destination);EO.start()}}catch(e){}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
function loop(t){
  requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(mode=='ride'){update(dt);hudT-=dt;if(hudT<=0){hud();hudT=.2}}
  else if(road.length){if(mode=='title'||mode=='brief'){st.z+=2600*dt;if(st.z>(road.length-DD-5)*SEG)st.z=0;st.v=3000}moveCars(dt);if(EG)EG.gain.value=0}
  render();if(toastT>0&&(toastT-=dt)<=0)$('#toast').classList.remove('on');
}
addEventListener('resize',resize);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=1;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)&&mode!='title')e.preventDefault();
  if(k=='m'&&mode=='ride'){mute=!mute;toast(mute?'🔇 Sesler kapalı':'🔊 Sesler açık')}
  if(mode!='ride'&&(k==' '||k=='enter')){const b=$('#nx')||$('#go');if(b&&mode!='title'&&!b.disabled)b.click()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('blur',()=>keys={});
S=fresh('Kurye','Elif');resize();title();requestAnimationFrame(loop);
</script>
